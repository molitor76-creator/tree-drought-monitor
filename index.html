<!DOCTYPE html>
<html>

<head>

<title>Tree Irrigation Monitor</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:#f2f6fb;
margin:40px;
}

.cards{
display:flex;
gap:20px;
margin-bottom:40px;
}

.card{
flex:1;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.status{
font-size:24px;
font-weight:bold;
}

.ok{color:green}
.warn{color:red}

canvas{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
max-width:900px;
}

</style>

</head>

<body>

<h1>Tree Irrigation Monitor</h1>

<div class="cards">

<div class="card">
<h3>Gauting</h3>
<div id="gStatus" class="status">Loading...</div>
</div>

<div class="card">
<h3>Waging am See</h3>
<div id="wStatus" class="status">Loading...</div>
</div>

<div class="card">
<h3>Dettenhausen</h3>
<div id="dStatus" class="status">Loading...</div>
</div>

</div>

<h2>Soil Water Storage</h2>

<canvas id="chart"></canvas>

<script>

async function load(){

const r=await fetch("data/history.csv")
const t=await r.text()

const rows=t.trim().split("\n").slice(1)

let dates=[]

let g=[],w=[],d=[]

rows.forEach(row=>{

const c=row.split(",")

const date=c[0]
const loc=c[1]
const s=parseFloat(c[2])

if(!dates.includes(date)){

dates.push(date)

g.push(null)
w.push(null)
d.push(null)

}

let i=dates.indexOf(date)

if(loc=="Gauting") g[i]=s
if(loc=="Waging am See") w[i]=s
if(loc=="Dettenhausen") d[i]=s

})

let last=dates.length-1

function set(id,val,cap){

let pct=val/cap

let el=document.getElementById(id)

if(pct<0.25){

el.innerText="⚠ WATER TREES"
el.className="status warn"

}else{

el.innerText="OK"
el.className="status ok"

}

}

set("gStatus",g[last],100)
set("wStatus",w[last],70)
set("dStatus",d[last],180)

new Chart(document.getElementById("chart"),{

type:"line",

data:{
labels:dates,
datasets:[
{label:"Gauting",data:g,borderColor:"red"},
{label:"Waging",data:w,borderColor:"blue"},
{label:"Dettenhausen",data:d,borderColor:"green"}
]
}

})

}

load()

</script>

</body>

</html>
