<!DOCTYPE html>
<html>

<head>

<title>Tree Irrigation Monitor</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
font-family:Arial;
margin:40px;
background:#f3f6fb;
}

.cards{
display:flex;
gap:20px;
margin-bottom:30px;
}

.card{
flex:1;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.status{
font-size:20px;
font-weight:bold;
}

.safe{color:green}
.soon{color:orange}
.now{color:red}

#map{
height:400px;
margin-top:30px;
border-radius:10px;
}

canvas{
margin-top:10px;
}

</style>

</head>

<body>

<h1>Tree Irrigation Monitor</h1>

<div class="cards">

<div class="card">
<h3>Gauting</h3>
<div id="gStatus" class="status"></div>
<div id="gReco"></div>
<canvas id="rainG"></canvas>
</div>

<div class="card">
<h3>Waging am See</h3>
<div id="wStatus" class="status"></div>
<div id="wReco"></div>
<canvas id="rainW"></canvas>
</div>

<div class="card">
<h3>Dettenhausen</h3>
<div id="dStatus" class="status"></div>
<div id="dReco"></div>
<canvas id="rainD"></canvas>
</div>

</div>

<h2>Irrigation Risk Map</h2>

<div id="map"></div>

<h2>Soil Water Trend</h2>

<canvas id="trend"></canvas>

<script>

const locations={
"Gauting":{lat:48.067,lon:11.377},
"Waging am See":{lat:47.933,lon:12.733},
"Dettenhausen":{lat:48.605,lon:9.106}
}

async function loadData(){

const response=await fetch("data/history.csv")
const text=await response.text()

const rows=text.trim().split("\n").slice(1)

let latest={}
let dates=[]
let g=[],w=[],d=[]

rows.forEach(row=>{

const c=row.split(",")

let date=c[0]
let loc=c[1]
let storage=parseFloat(c[2])
let irrigation=parseFloat(c[4])
let risk=c[5]

latest[loc]={storage,irrigation,risk}

if(!dates.includes(date)){
dates.push(date)
g.push(null)
w.push(null)
d.push(null)
}

let i=dates.indexOf(date)

if(loc==="Gauting") g[i]=storage
if(loc==="Waging am See") w[i]=storage
if(loc==="Dettenhausen") d[i]=storage

})

updateCard("Gauting","gStatus","gReco",latest["Gauting"])
updateCard("Waging am See","wStatus","wReco",latest["Waging am See"])
updateCard("Dettenhausen","dStatus","dReco",latest["Dettenhausen"])

drawMap(latest)

drawTrend(dates,g,w,d)

drawRainCharts()

}

function updateCard(name,statusId,recoId,data){

let s=document.getElementById(statusId)
let r=document.getElementById(recoId)

if(data.risk==="NOW"){

s.innerText="⚠ WATER NOW"
s.className="status now"

r.innerText="Recommended: "+data.irrigation+" mm"

}
else if(data.risk==="SOON"){

s.innerText="⚠ Water soon"
s.className="status soon"

r.innerText=""

}
else{

s.innerText="OK"
s.className="status safe"

r.innerText=""

}

}

function drawMap(data){

const map=L.map('map').setView([48.2,11.6],7)

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map)

function color(r){

if(r==="SAFE") return "green"
if(r==="SOON") return "orange"
return "red"

}

Object.keys(locations).forEach(name=>{

const loc=locations[name]

L.circleMarker(
[loc.lat,loc.lon],
{color:color(data[name].risk),radius:8}
).addTo(map).bindPopup(name)

})

}

function drawTrend(dates,g,w,d){

new Chart(document.getElementById("trend"),{

type:"line",

data:{
labels:dates,
datasets:[
{label:"Gauting",data:g,borderColor:"red"},
{label:"Waging",data:w,borderColor:"blue"},
{label:"Dettenhausen",data:d,borderColor:"green"}
]
}

})

}

async function drawRainCharts(){

for(const name in locations){

const lat=locations[name].lat
const lon=locations[name].lon

const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=precipitation_sum&timezone=Europe%2FBerlin`

const data=await fetch(url).then(r=>r.json())

const rain=data.daily.precipitation_sum.slice(0,7)

const canvas=
name==="Gauting"?"rainG":
name==="Waging am See"?"rainW":
"rainD"

new Chart(document.getElementById(canvas),{

type:"bar",

data:{
labels:["1","2","3","4","5","6","7"],
datasets:[{
label:"Rain (mm)",
data:rain
}]

}

})

}

}

loadData()

</script>

</body>
</html>
