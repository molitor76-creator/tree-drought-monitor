<!DOCTYPE html>
<html>

<head>

<title>Tree Irrigation Monitor</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
font-family:Arial;
margin:40px;
background:#f3f6fb;
}

.cards{
display:flex;
gap:20px;
margin-bottom:30px;
}

.card{
flex:1;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.status{
font-size:20px;
font-weight:bold;
}

.safe{color:green}
.soon{color:orange}
.now{color:red}

canvas{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
margin-top:20px;
}

#map{
height:400px;
margin-top:30px;
border-radius:10px;
}

</style>

</head>

<body>

<h1>Tree Irrigation Monitor</h1>

<div class="cards">

<div class="card">
<h3>Gauting</h3>
<div id="gStatus" class="status"></div>
<div id="gReco"></div>
<canvas id="rainG"></canvas>
</div>

<div class="card">
<h3>Waging am See</h3>
<div id="wStatus" class="status"></div>
<div id="wReco"></div>
<canvas id="rainW"></canvas>
</div>

<div class="card">
<h3>Dettenhausen</h3>
<div id="dStatus" class="status"></div>
<div id="dReco"></div>
<canvas id="rainD"></canvas>
</div>

</div>

<h2>Irrigation Risk Map</h2>

<div id="map"></div>

<h2>Soil Water Trend</h2>

<canvas id="chart"></canvas>

<script>

const locations={
"Gauting":{lat:48.067,lon:11.377,cap:100},
"Waging am See":{lat:47.933,lon:12.733,cap:70},
"Dettenhausen":{lat:48.605,lon:9.106,cap:180}
}

async function load(){

const r=await fetch("data/history.csv")
const t=await r.text()

const rows=t.trim().split("\n").slice(1)

let dates=[]
let g=[],w=[],d=[]
let gI=[],wI=[],dI=[]
let gR,wR,dR

rows.forEach(row=>{

const c=row.split(",")

const date=c[0]
const loc=c[1]
const s=parseFloat(c[2])
const irr=parseFloat(c[5])
const risk=c[6]

if(!dates.includes(date)){

dates.push(date)

g.push(null)
w.push(null)
d.push(null)

gI.push(null)
wI.push(null)
dI.push(null)

}

let i=dates.indexOf(date)

if(loc=="Gauting"){g[i]=s;gI[i]=irr;gR=risk}
if(loc=="Waging am See"){w[i]=s;wI[i]=irr;wR=risk}
if(loc=="Dettenhausen"){d[i]=s;dI[i]=irr;dR=risk}

})

let last=dates.length-1

function card(risk,irr,idStatus,idReco){

let s=document.getElementById(idStatus)
let r=document.getElementById(idReco)

if(risk=="NOW"){
s.innerText="⚠ WATER NOW"
s.className="status now"
r.innerText="Recommended: "+irr+" mm"
}

else if(risk=="SOON"){
s.innerText="⚠ Water likely needed soon"
s.className="status soon"
r.innerText=""
}

else{
s.innerText="OK"
s.className="status safe"
r.innerText=""
}

}

card(gR,gI[last],"gStatus","gReco")
card(wR,wI[last],"wStatus","wReco")
card(dR,dI[last],"dStatus","dReco")

new Chart(document.getElementById("chart"),{

type:"line",

data:{
labels:dates,
datasets:[
{label:"Gauting",data:g,borderColor:"red"},
{label:"Waging",data:w,borderColor:"blue"},
{label:"Dettenhausen",data:d,borderColor:"green"}
]
}

})

drawMap(gR,wR,dR)

}

function drawMap(g,w,d){

const map=L.map('map').setView([48.2,11.6],7)

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map)

function color(r){

if(r=="SAFE") return "green"
if(r=="SOON") return "orange"
return "red"

}

L.circleMarker([48.067,11.377],{color:color(g),radius:8}).addTo(map).bindPopup("Gauting")
L.circleMarker([47.933,12.733],{color:color(w),radius:8}).addTo(map).bindPopup("Waging")
L.circleMarker([48.605,9.106],{color:color(d),radius:8}).addTo(map).bindPopup("Dettenhausen")

}

load()

</script>

</body>

</html>
