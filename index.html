<!DOCTYPE html>
<html>

<head>

<title>Tree Irrigation Monitor</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
font-family:Arial;
margin:40px;
background:#f3f6fb;
}

.cards{
display:flex;
gap:20px;
margin-bottom:30px;
}

.card{
flex:1;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.status{
font-size:20px;
font-weight:bold;
}

.safe{color:green}
.soon{color:orange}
.now{color:red}

canvas{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
margin-top:20px;
}

#map{
height:400px;
margin-top:30px;
border-radius:10px;
}

</style>

</head>

<body>

<h1>Tree Irrigation Monitor</h1>

<div class="cards">

<div class="card">
<h3>Gauting</h3>
<div id="gStatus" class="status"></div>
<div id="gReco"></div>
<canvas id="rainG"></canvas>
</div>

<div class="card">
<h3>Waging am See</h3>
<div id="wStatus" class="status"></div>
<div id="wReco"></div>
<canvas id="rainW"></canvas>
</div>

<div class="card">
<h3>Dettenhausen</h3>
<div id="dStatus" class="status"></div>
<div id="dReco"></div>
<canvas id="rainD"></canvas>
</div>

</div>

<h2>Irrigation Risk Map</h2>

<div id="map"></div>

<h2>Soil Water Trend</h2>

<canvas id="chart"></canvas>

<script>

const locations={
"Gauting":{lat:48.067,lon:11.377},
"Waging am See":{lat:47.933,lon:12.733},
"Dettenhausen":{lat:48.605,lon:9.106}
}

async function load(){

const r=await fetch("data/history.csv")
const t=await r.text()

const rows=t.trim().split("\n").slice(1)

let data={}

rows.forEach(row=>{

const c=row.split(",")

data[c[1]]={
storage:parseFloat(c[2]),
future:parseFloat(c[3]),
stress:c[4],
irrigation:parseFloat(c[5]),
risk:c[6]
}

})

updateCard("Gauting","gStatus","gReco",data["Gauting"])
updateCard("Waging am See","wStatus","wReco",data["Waging am See"])
updateCard("Dettenhausen","dStatus","dReco",data["Dettenhausen"])

drawMap(data)

drawTrend(rows)

}

function updateCard(name,idStatus,idReco,d){

let s=document.getElementById(idStatus)
let r=document.getElementById(idReco)

if(d.risk==="NOW"){

s.innerText="⚠ WATER NOW"
s.className="status now"

r.innerText="Recommended: "+d.irrigation+" mm"

}

else if(d.risk==="SOON"){

s.innerText="⚠ Water likely soon"
s.className="status soon"

r.innerText=""

}

else{

s.innerText="OK"
s.className="status safe"

r.innerText=""

}

}

function drawMap(data){

const map=L.map('map').setView([48.2,11.6],7)

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map)

function color(r){

if(r==="SAFE") return "green"
if(r==="SOON") return "orange"
return "red"

}

Object.keys(locations).forEach(name=>{

const loc=locations[name]

L.circleMarker(
[loc.lat,loc.lon],
{color:color(data[name].risk),radius:8}
).addTo(map).bindPopup(name)

})

}

function drawTrend(rows){

let dates=[]
let g=[]
let w=[]
let d=[]

rows.forEach(row=>{

const c=row.split(",")

let date=c[0]
let loc=c[1]
let s=parseFloat(c[2])

if(!dates.includes(date)){

dates.push(date)
g.push(null)
w.push(null)
d.push(null)

}

let i=dates.indexOf(date)

if(loc==="Gauting") g[i]=s
if(loc==="Waging am See") w[i]=s
if(loc==="Dettenhausen") d[i]=s

})

new Chart(document.getElementById("chart"),{

type:"line",

data:{
labels:dates,
datasets:[
{label:"Gauting",data:g,borderColor:"red"},
{label:"Waging",data:w,borderColor:"blue"},
{label:"Dettenhausen",data:d,borderColor:"green"}
]
}

})

}

load()

</script>

</body>

</html>
