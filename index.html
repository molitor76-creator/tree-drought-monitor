<!DOCTYPE html>
<html>
<head>
    <title>Tree Irrigation Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f3f6fb; }
        .cards { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { flex: 1; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .status { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .safe { color: green; }
        .soon { color: orange; }
        .now { color: red; }
        #map { height: 400px; margin-top: 30px; border-radius: 10px; }
        canvas { margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Tree Irrigation Monitor</h1>
    <div class="cards">
        <div class="card"><h3>Gauting</h3><div id="gStatus" class="status"></div><div id="gReco"></div><canvas id="rainG"></canvas></div>
        <div class="card"><h3>Waging am See</h3><div id="wStatus" class="status"></div><div id="wReco"></div><canvas id="rainW"></canvas></div>
        <div class="card"><h3>Dettenhausen</h3><div id="dStatus" class="status"></div><div id="dReco"></div><canvas id="rainD"></canvas></div>
    </div>
    <h2>Irrigation Risk Map</h2>
    <div id="map"></div>
    <h2>Soil Water Trend</h2>
    <canvas id="trend"></canvas>

    <script>
        const locations = {
            "Gauting": {lat: 48.067, lon: 11.377},
            "Waging am See": {lat: 47.933, lon: 12.733},
            "Dettenhausen": {lat: 48.605, lon: 9.106}
        };

        async function loadData() {
            try {
                // The "?t=" part forces the browser to bypass the cache and get the latest data
                const response = await fetch("data/history.csv?t=" + new Date().getTime());
                const text = await response.text();
                const rows = text.trim().split("\n").slice(1);
                
                let latest = {};
                let dates = [], g = [], w = [], d = [];

                rows.forEach(row => {
                    const c = row.split(",");
                    if (c.length < 6) return; // Skip incomplete rows

                    let date = c[0], loc = c[1], storage = parseFloat(c[2]), risk = c[5]?.trim().toUpperCase();
                    latest[loc] = {storage, irrigation: c[4], risk};

                    if(!dates.includes(date)) { 
                        dates.push(date); g.push(null); w.push(null); d.push(null); 
                    }
                    let i = dates.indexOf(date);
                    if(loc === "Gauting") g[i] = storage;
                    if(loc === "Waging am See") w[i] = storage;
                    if(loc === "Dettenhausen") d[i] = storage;
                });

                updateCard("Gauting", "gStatus", "gReco", latest["Gauting"]);
                updateCard("Waging am See", "wStatus", "wReco", latest["Waging am See"]);
                updateCard("Dettenhausen", "dStatus", "dReco", latest["Dettenhausen"]);
                drawMap(latest);
                drawTrend(dates, g, w, d);
                drawRainCharts();
            } catch (e) { 
                console.error("Error loading CSV:", e);
                document.querySelectorAll('.status').forEach(el => el.innerText = "Data Loading...");
            }
        }

        function updateCard(name, statusId, recoId, data) {
            let s = document.getElementById(statusId);
            let r = document.getElementById(recoId);
            if (!data || !data.risk) {
                s.innerText = "No Data Yet";
                return;
            }

            if (data.risk === "NOW") {
                s.innerText = "⚠ WATER NOW"; s.className = "status now";
                r.innerText = "Irrigation: " + data.irrigation + " mm";
            } else if (data.risk === "SOON") {
                s.innerText = "⚠ Water Soon"; s.className = "status soon";
                r.innerText = "Monitor closely";
            } else if (data.risk === "SAFE") {
                s.innerText = "OK"; s.className = "status safe";
                r.innerText = "Soil moisture adequate";
            } else {
                s.innerText = "Status: " + data.risk; s.className = "status";
            }
        }

        function drawMap(data) {
            const map = L.map('map').setView([48.2, 11.6], 7);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            
            Object.keys(locations).forEach(name => {
                const loc = locations[name];
                const risk = data[name]?.risk;
                let color = "gray";
                if(risk === "SAFE") color = "green";
                if(risk === "SOON") color = "orange";
                if(risk === "NOW") color = "red";

                L.circleMarker([loc.lat, loc.lon], {
                    color: color, 
                    radius: 12, 
                    fillOpacity: 0.8,
                    weight: 2
                }).addTo(map).bindPopup(`<b>${name}</b><br>Status: ${risk || 'Unknown'}`);
            });
        }

        function drawTrend(dates, g, w, d) {
            new Chart(document.getElementById("trend"), {
                type: "line",
                data: { labels: dates, datasets: [
                    {label: "Gauting", data: g, borderColor: "red", tension: 0.1},
                    {label: "Waging", data: w, borderColor: "blue", tension: 0.1},
                    {label: "Dettenhausen", data: d, borderColor: "green", tension: 0.1}
                ]}
            });
        }

        async function drawRainCharts() {
            for (const name in locations) {
                const {lat, lon} = locations[name];
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=precipitation_sum&timezone=Europe%2FBerlin`);
                const data = await response.json();
                
                // Convert dates (2026-03-24) into Weekdays (Mon, Tue...)
                const labels = data.daily.time.slice(1, 8).map(dateStr => {
                    const date = new Date(dateStr);
                    return date.toLocaleDateString('en-US', { weekday: 'short' });
                });

                const rainValues = data.daily.precipitation_sum.slice(1, 8);
                const canvasId = name === "Gauting" ? "rainG" : name === "Waging am See" ? "rainW" : "rainD";
                
                new Chart(document.getElementById(canvasId), {
                    type: "bar",
                    data: { 
                        labels: labels, 
                        datasets: [{
                            label: "Rain (mm)", 
                            data: rainValues, 
                            backgroundColor: "rgba(54, 162, 235, 0.6)"
                        }]
                    },
                    options: { plugins: { legend: { display: false } } }
                });
            }
        }
        loadData();
    </script>
</body>
</html>
